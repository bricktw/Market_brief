# Build VitePress + publish to GitHub Pages.
#
# Setup checklist (one-time, in the repo's GitHub UI):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# No secrets are needed for the build itself — the brief markdown is already
# committed by the scheduled-brief workflow (or by a local push). This workflow
# just compiles the static site and uploads it as a Pages artifact.
#
# TRIGGERS — why there are three (do not drop `workflow_run`):
#   - push:         human/local pushes that touch docs/** etc. publish directly.
#   - workflow_run: the scheduled-brief workflow commits new briefs using the
#       default GITHUB_TOKEN, and GitHub deliberately does NOT let a GITHUB_TOKEN
#       push trigger another workflow (recursion guard). So the `push` trigger
#       above NEVER fires for bot-committed briefs — the site would silently
#       freeze at the last human-triggered deploy (this happened: stuck from
#       2026-06-19 to 2026-07-25). `workflow_run` fires after "Scheduled brief"
#       finishes regardless of the token, which is what keeps the site current.
#   - workflow_dispatch: manual catch-up button.
# The two-workflow boundary is preserved (scheduled-brief generates, this one
# publishes) — they are chained by completion event, not merged.

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
      - "package-lock.json"
  workflow_run:
    workflows: ["Scheduled brief"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # When triggered by the scheduled-brief completion, only publish if that run
    # succeeded. push / workflow_dispatch have no workflow_run context, so the
    # first clause lets them through unconditionally.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build VitePress
        # base_path is e.g. "/Market_brief"; VitePress wants a trailing slash.
        env:
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
